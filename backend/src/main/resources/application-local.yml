# Local development (docker compose stack with Postgres + Mailpit).
complyr:
  auth:
    # Dev-only fallback (>= 32 chars) so `bootRun`/compose work out of the box.
    # dev/prd have NO fallback and fail fast when JWT_SECRET is unset.
    jwt-secret: ${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-prd-0123456789}
  consent:
    # Dev-only fallback (>= 32 bytes) for the consent-origin token secret, same rationale as
    # jwt-secret above: dev/prd fail fast when CONSENT_ORIGIN_TOKEN_SECRET is unset.
    origin-token-secret: ${CONSENT_ORIGIN_TOKEN_SECRET:local-dev-only-consent-origin-token-secret-0123456789}
  billing:
    # Dev-only Stripe fallbacks so `bootRun`/compose start without real credentials. These are
    # placeholders — Checkout/Portal calls fail against them; set real TEST-mode values in .env to
    # exercise billing locally. dev/prd have NO fallback and fail fast when these env vars are unset.
    stripe-secret-key: ${STRIPE_SECRET_KEY:sk_test_local_placeholder}
    price-ids:
      starter: ${STRIPE_PRICE_STARTER:price_local_placeholder_starter}
      pro: ${STRIPE_PRICE_PRO:price_local_placeholder_pro}
      business: ${STRIPE_PRICE_BUSINESS:price_local_placeholder_business}
    # Stripe Tax off locally by default (a local test account usually has no Tax configured).
    automatic-tax: ${STRIPE_AUTOMATIC_TAX:false}
  # Local-only wide-open CORS so the Vite dev harness (localhost:5173) can call the API
  # cross-origin. dev/prd omit this block and fall back to the credential-less, all-origins
  # defaults in ComplyrProperties.Cors. allow-credentials stays false (never send cookies).
  cors:
    paths:
      - "/**"
    allowed-origins:
      - "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"

logging:
  level:
    com.complyr: DEBUG
    org.springframework.security: DEBUG

server:
  error:
    include-message: always
