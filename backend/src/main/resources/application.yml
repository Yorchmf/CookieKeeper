spring:
  application:
    name: complyr-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/complyr}
    username: ${DB_USER:complyr}
    password: ${DB_PASSWORD:complyr}
    hikari:
      # CX22 (2 vCPU / 4GB) runs dev+prd side by side (two API JVMs, two Postgres,
      # dashboards, scanner). A small pool is correct: Postgres throughput on 2 vCPU
      # peaks around a handful of active connections, and each idle connection still
      # costs backend memory. Env-overridable so the load smoke test (infra/load) can
      # tune it without a rebuild. Must stay well under Postgres max_connections
      # summed across every service that connects.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      # JavaMail defaults to infinite timeouts — bound every phase so a hung relay
      # can never pin the (async) mail executor threads indefinitely.
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  messages:
    basename: messages/notify
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: 8080
  tomcat:
    threads:
      # Default is 200 worker threads per JVM — far too many for a 2 vCPU box shared
      # by two API JVMs: ~200 idle thread stacks each waste memory, and requests still
      # serialize on the 10-connection Hikari pool. Cap to a value comfortably above
      # the pool so DB-bound requests queue in Tomcat (not the OS) while cache-served
      # reads (health, hosted policy) still flow. Confirm/adjust from the load smoke
      # test (infra/load); env-overridable so tuning needs no rebuild.
      max: ${SERVER_TOMCAT_MAX_THREADS:50}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:5}
    # Backlog of connections accepted while all worker threads are busy — a short
    # spike buffers here instead of being refused; a sustained overload sheds fast.
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:2000}
  # All dev/prd traffic arrives via the Caddy container, so remoteAddr would otherwise be
  # Caddy's IP for every client (collapsing per-IP rate limiting into one global bucket).
  # `native` enables Tomcat's RemoteIpValve, which honors X-Forwarded-For only when the
  # immediate peer matches its internal-proxies list (by default RFC1918/docker subnets —
  # i.e. only our Caddy container). A spoofed XFF on a direct external connection is not
  # trusted, so request.remoteAddr stays authentic.
  forward-headers-strategy: native

complyr:
  # No default for JWT_SECRET here on purpose: dev/prd fail fast at startup if unset.
  # A dev-only fallback exists in application-local.yml; tests set it in test resources.
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    verification-token-ttl: 24h
    reset-token-ttl: 1h
    email-change-token-ttl: 24h
  consent:
    # How long a claimed dedupe key lives before the reaper prunes it. Only has to outlive a
    # pending widget retry (localStorage replays drain within days); short keeps the table small.
    idempotency-retention: ${CONSENT_IDEMPOTENCY_RETENTION:14d}
    # Reaper schedule (Spring cron, server zone). Default 03:30 daily is also baked into the job.
    idempotency-prune-cron: ${CONSENT_IDEMPOTENCY_PRUNE_CRON:0 30 3 * * *}
    # HMAC secret for the stateless consent-origin token (ADR-13). No default here on purpose:
    # dev/prd fail fast at startup if unset (dev-only fallback lives in application-local.yml,
    # tests set it in test resources). Must be >= 32 bytes — validated by the ConsentOriginToken bean.
    origin-token-secret: ${CONSENT_ORIGIN_TOKEN_SECRET}
    # How long a minted origin token stays valid. Short (bounds replay) but above client→server
    # latency; the widget self-censors tokens older than ~90s to stay clear of this ceiling.
    origin-token-ttl: ${CONSENT_ORIGIN_TOKEN_TTL:2m}
    # Consent-log retention window in months (ADR-16). Partitions whose entire month is older than
    # this are dropped by ConsentEventPartitionReaper. Tenant-blind, so it MUST be >= the longest
    # plan retention (Pro/Business 3 yr = 36); validated >= 12 (shortest plan) at startup.
    retention-months: ${CONSENT_RETENTION_MONTHS:36}
    # Retention-drop schedule (Spring cron, server zone). Default 04:00 daily is baked into the job;
    # runs after the provisioner (03:15) and the idempotency/public-scan reapers (03:30/03:45).
    retention-drop-cron: ${CONSENT_RETENTION_DROP_CRON:0 0 4 * * *}
  impression:
    # Banner-impression counter retention (Track 4 Slice D). A disposable per-(site, day) aggregate
    # with no personal data, read only over the dashboard's analytics windows — so this only has to
    # exceed the widest window (~30d) with headroom, not the multi-year consent retention.
    retention: ${IMPRESSION_RETENTION:90d}
    # Reaper schedule (Spring cron, server zone). Default 03:45 daily is also baked into the job;
    # staggered off the consent idempotency prune (03:30) so the nightly reapers don't overlap.
    prune-cron: ${IMPRESSION_PRUNE_CRON:0 45 3 * * *}
  scan:
    # How often a scanner worker polls the queue (only the `scanner` profile runs the poller).
    poll-interval-millis: ${SCAN_POLL_INTERVAL_MS:5000}
    # A claimed job is hidden this long before being treated as crashed and redelivered — must
    # exceed the worst-case crawl time (§4.4 caps a job at 10min).
    visibility-timeout: ${SCAN_VISIBILITY_TIMEOUT:15m}
    max-attempts: ${SCAN_MAX_ATTEMPTS:3}
    retry-backoff: ${SCAN_RETRY_BACKOFF:1m}
    # Crawl budget (§4.4). max-pages bounds breadth; page-timeout caps a single navigation;
    # job-timeout caps the whole crawl and MUST stay under visibility-timeout so a slow-but-live
    # crawl always finishes before the queue redelivers the job.
    max-pages: ${SCAN_MAX_PAGES:10}
    page-timeout: ${SCAN_PAGE_TIMEOUT:60s}
    job-timeout: ${SCAN_JOB_TIMEOUT:10m}
    # Abuse bounds on the attacker-influenced cookie set (§4.4). A verified but hostile site can drop
    # many cookies with long, arbitrary names into an unbounded text column; cap the row count and
    # truncate over-long names before persistence so one scan can't bloat scan_cookies.
    max-cookies: ${SCAN_MAX_COOKIES:500}
    max-cookie-name-length: ${SCAN_MAX_COOKIE_NAME_LENGTH:256}
  verification:
    # Domain verification (ADR-17). This is the ONE app-initiated outbound request to a
    # customer-controlled host from the `api` container, and it runs synchronously while a user waits
    # on a Tomcat thread — so these are safety bounds, not tuning knobs. Every value is range-checked
    # at startup (a fat-fingered `total-budget: 10m` is an outage, not a slow endpoint).
    connect-timeout: ${VERIFICATION_CONNECT_TIMEOUT:5s}
    # Per-hop read timeout; must be <= total-budget or it is unreachable.
    request-timeout: ${VERIFICATION_REQUEST_TIMEOUT:5s}
    # Whole-operation budget for the HTTP half, redirects included.
    total-budget: ${VERIFICATION_TOTAL_BUDGET:10s}
    # Redirect hops beyond the first request. Each hop is re-validated (SSRF guards run per hop).
    max-redirects: ${VERIFICATION_MAX_REDIRECTS:3}
    # Bytes of homepage HTML buffered before truncation. Truncation can only cause a false negative.
    max-body-bytes: ${VERIFICATION_MAX_BODY_BYTES:524288}
    # TXT-lookup timeout for the DNS fallback. Sits OUTSIDE total-budget, and the JDK applies it per
    # nameserver per retry — a lookup can cost ~2 x this x (nameservers in resolv.conf).
    dns-timeout: ${VERIFICATION_DNS_TIMEOUT:2s}
  billing:
    # Stripe credentials. No defaults here on purpose: dev/prd fail fast at startup if unset, and each
    # environment MUST supply its own — local/dev use Stripe TEST-mode keys+prices (sk_test_/test-mode
    # price_...), prd uses LIVE-mode ones (sk_live_/live price_...). A test-mode price id is invalid
    # against a live key and vice versa, so they are never shared. A dev-only fallback lives in
    # application-local.yml; tests set placeholders in application.properties.
    stripe-secret-key: ${STRIPE_SECRET_KEY}
    # Webhook endpoint signing secret (whsec_...). Also env-specific and no default here: each
    # environment registers its own Stripe webhook endpoint and gets its own secret. Every inbound
    # webhook body is HMAC-verified against this before a single field is trusted.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    price-ids:
      starter: ${STRIPE_PRICE_STARTER}
      pro: ${STRIPE_PRICE_PRO}
      business: ${STRIPE_PRICE_BUSINESS}
    # Stripe Tax on Checkout. On by default; set false in an environment whose Stripe account has no
    # Tax configured (automatic_tax against a Tax-less account errors the Checkout create).
    automatic-tax: ${STRIPE_AUTOMATIC_TAX:true}
  mail:
    # Which EmailSender delivers transactional mail. `smtp` (default) → Mailpit locally via spring.mail
    # above; dev/prd override to `brevo` (see application-dev/prd.yml) to use Brevo's EU HTTP API.
    provider: ${MAIL_PROVIDER:smtp}
    brevo:
      # No default here on purpose: when provider=brevo the BrevoEmailSender bean fails fast at startup
      # if this is blank. Empty default keeps the smtp path (and unit tests) constructing without it.
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
      sender-name: ${BREVO_SENDER_NAME:Complyr}
  observability:
    # Error tracking (ADR-15). Sentry SaaS EU region ONLY (DSN host *.de.sentry.io) for GDPR data
    # residency (CLAUDE.md #2) — a non-EU DSN is refused at startup. A BLANK dsn disables Sentry, so
    # local (and any environment that hasn't set SENTRY_DSN_BACKEND) runs with error tracking off. No
    # PII is ever sent: send-default-pii stays off and request/user context is scrubbed (CLAUDE.md #4).
    sentry:
      dsn: ${SENTRY_DSN_BACKEND:}
      environment: ${SENTRY_ENVIRONMENT:local}
      release: ${SENTRY_RELEASE:}
      traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  app-base-url: ${APP_BASE_URL:http://localhost:3000}
  cdn-base-url: ${CDN_BASE_URL:http://localhost:8081}
  mail-from: ${MAIL_FROM:no-reply@complyr.eu}
  # Destination for in-app support contact-form messages. Our own inbox; the submitting customer's
  # address rides the email's Reply-To, not this field.
  support-inbox: ${SUPPORT_INBOX:support@complyr.eu}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Email is best-effort (failures never break signup) — an unreachable SMTP
      # host must not flip the container health probe to DOWN.
      enabled: false
