spring:
  application:
    name: complyr-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/complyr}
    username: ${DB_USER:complyr}
    password: ${DB_PASSWORD:complyr}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
