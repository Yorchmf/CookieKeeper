spring:
  application:
    name: complyr-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/complyr}
    username: ${DB_USER:complyr}
    password: ${DB_PASSWORD:complyr}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      # JavaMail defaults to infinite timeouts — bound every phase so a hung relay
      # can never pin the (async) mail executor threads indefinitely.
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  messages:
    basename: messages/notify
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: 8080
  # All dev/prd traffic arrives via the Caddy container, so remoteAddr would otherwise be
  # Caddy's IP for every client (collapsing per-IP rate limiting into one global bucket).
  # `native` enables Tomcat's RemoteIpValve, which honors X-Forwarded-For only when the
  # immediate peer matches its internal-proxies list (by default RFC1918/docker subnets —
  # i.e. only our Caddy container). A spoofed XFF on a direct external connection is not
  # trusted, so request.remoteAddr stays authentic.
  forward-headers-strategy: native

complyr:
  # No default for JWT_SECRET here on purpose: dev/prd fail fast at startup if unset.
  # A dev-only fallback exists in application-local.yml; tests set it in test resources.
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    verification-token-ttl: 24h
    reset-token-ttl: 1h
  consent:
    # How long a claimed dedupe key lives before the reaper prunes it. Only has to outlive a
    # pending widget retry (localStorage replays drain within days); short keeps the table small.
    idempotency-retention: ${CONSENT_IDEMPOTENCY_RETENTION:14d}
    # Reaper schedule (Spring cron, server zone). Default 03:30 daily is also baked into the job.
    idempotency-prune-cron: ${CONSENT_IDEMPOTENCY_PRUNE_CRON:0 30 3 * * *}
  scan:
    # How often a scanner worker polls the queue (only the `scanner` profile runs the poller).
    poll-interval-millis: ${SCAN_POLL_INTERVAL_MS:5000}
    # A claimed job is hidden this long before being treated as crashed and redelivered — must
    # exceed the worst-case crawl time (§4.4 caps a job at 10min).
    visibility-timeout: ${SCAN_VISIBILITY_TIMEOUT:15m}
    max-attempts: ${SCAN_MAX_ATTEMPTS:3}
    retry-backoff: ${SCAN_RETRY_BACKOFF:1m}
    # Crawl budget (§4.4). max-pages bounds breadth; page-timeout caps a single navigation;
    # job-timeout caps the whole crawl and MUST stay under visibility-timeout so a slow-but-live
    # crawl always finishes before the queue redelivers the job.
    max-pages: ${SCAN_MAX_PAGES:10}
    page-timeout: ${SCAN_PAGE_TIMEOUT:60s}
    job-timeout: ${SCAN_JOB_TIMEOUT:10m}
    # Abuse bounds on the attacker-influenced cookie set (§4.4). A verified but hostile site can drop
    # many cookies with long, arbitrary names into an unbounded text column; cap the row count and
    # truncate over-long names before persistence so one scan can't bloat scan_cookies.
    max-cookies: ${SCAN_MAX_COOKIES:500}
    max-cookie-name-length: ${SCAN_MAX_COOKIE_NAME_LENGTH:256}
  app-base-url: ${APP_BASE_URL:http://localhost:3000}
  cdn-base-url: ${CDN_BASE_URL:http://localhost:8081}
  mail-from: ${MAIL_FROM:no-reply@complyr.eu}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Email is best-effort (failures never break signup) — an unreachable SMTP
      # host must not flip the container health probe to DOWN.
      enabled: false
