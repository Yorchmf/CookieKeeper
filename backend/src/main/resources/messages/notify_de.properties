verification.subject=Bestätigen Sie Ihre E-Mail-Adresse
verification.body=<p>Willkommen bei Complyr!</p><p>Bitte bestätigen Sie Ihre E-Mail-Adresse über den folgenden Link:</p><p><a href="{0}">E-Mail-Adresse bestätigen</a></p><p>Dieser Link läuft in 24 Stunden ab. Falls Sie kein Konto erstellt haben, können Sie diese E-Mail ignorieren.</p>
reset.subject=Passwort zurücksetzen
reset.body=<p>Wir haben eine Anfrage zum Zurücksetzen Ihres Complyr-Passworts erhalten.</p><p><a href="{0}">Passwort zurücksetzen</a></p><p>Dieser Link läuft in 1 Stunde ab. Falls Sie keine Zurücksetzung angefordert haben, können Sie diese E-Mail ignorieren.</p>
welcome.subject=Willkommen bei Complyr – Ihre E-Mail ist bestätigt
welcome.body=<p>Ihre E-Mail-Adresse ist bestätigt und Ihr Complyr-Konto ist bereit.</p><p>Fügen Sie Ihre erste Website hinzu, führen Sie einen Cookie-Scan durch und binden Sie Ihr Consent-Banner über das Dashboard ein:</p><p><a href="{0}">Mein Dashboard öffnen</a></p><p>Brauchen Sie Hilfe? Antworten Sie einfach auf diese E-Mail.</p>
subscriptionActivated.subject=Ihr Complyr-Tarif {0} ist aktiv
subscriptionActivated.body=<p>Ihr Complyr-Tarif {0} ist jetzt aktiv – vielen Dank für Ihr Abonnement.</p><p>Alle Funktionen Ihres Tarifs sind freigeschaltet. Sie können jederzeit Rechnungen einsehen, Ihre Zahlungsmethode aktualisieren oder den Tarif wechseln:</p><p><a href="{1}">Mein Abonnement verwalten</a></p>
paymentIssue.subject=Aktion erforderlich: Ihre Complyr-Zahlung ist fehlgeschlagen
paymentIssue.body=<p>Wir konnten die letzte Zahlung für Ihr Complyr-Abonnement nicht verarbeiten.</p><p>Ihre Banner laufen vorerst weiter, aber bitte aktualisieren Sie Ihre Zahlungsmethode, um den Zugang nicht zu verlieren:</p><p><a href="{0}">Zahlungsmethode aktualisieren</a></p>
scanCompleted.subject=Cookie-Scan für {0} abgeschlossen
scanCompleted.body=<p>Wir haben den Scan von <strong>{0}</strong> abgeschlossen.</p><p>Gefundene Cookies: {1}<br>Marketing-Tracker: {2}</p><p>Öffnen Sie den vollständigen Bericht, um jedes Cookie zu prüfen, Ihre Banner-Kategorien anzupassen und Ihre Cookie-Richtlinie zu aktualisieren:</p><p><a href="{3}">Scan-Bericht ansehen</a></p>
trialEnding.subject=Ihre Complyr-Testphase endet bald
trialEnding.body=<p>Ihre kostenlose Complyr-Testphase endet am <strong>{0}</strong>.</p><p>Wählen Sie vorher einen Tarif, damit Ihre Consent-Banner aktiv bleiben, Ihre Scans weiterlaufen und Ihr Consent-Log weiter Nachweise sammelt:</p><p><a href="{1}">Tarif wählen</a></p>
emailChange.subject=Bestätigen Sie Ihre neue E-Mail-Adresse
emailChange.body=<p>Wir haben eine Anfrage erhalten, die E-Mail-Adresse Ihres Complyr-Kontos in diese zu ändern.</p><p>Bitte bestätigen Sie über den folgenden Link, dass dies Ihre Adresse ist:</p><p><a href="{0}">Neue E-Mail-Adresse bestätigen</a></p><p>Dieser Link läuft in 24 Stunden ab. Bis zur Bestätigung behält Ihr Konto die aktuelle E-Mail-Adresse. Falls Sie diese Änderung nicht angefordert haben, können Sie diese E-Mail ignorieren.</p>
emailChangedNotice.subject=Die E-Mail-Adresse Ihres Complyr-Kontos wurde geändert
emailChangedNotice.body=<p>Die E-Mail-Adresse Ihres Complyr-Kontos wurde soeben in eine neue Adresse geändert.</p><p>Wenn Sie das waren, ist nichts weiter zu tun.</p><p>Falls Sie diese Änderung nicht vorgenommen haben, sichern Sie Ihr Konto jetzt, indem Sie Ihr Passwort über das Dashboard zurücksetzen:</p><p><a href="{0}">Zum Dashboard</a></p>
blockingAlertUnblocked.subject=Complyr ist auf {0} installiert, blockiert aber nichts
blockingAlertUnblocked.body=<p>Complyr läuft seit {1} Tag(en) auf <strong>{0}</strong>, und unsere Scans sehen diese Dienste weiterhin laden, <em>bevor</em> Ihre Besucher einwilligen:</p><p><strong>{2}</strong></p><p>Ihr Banner gibt damit ein Versprechen, das die Website nicht einhält. Das ist schlechter als gar kein Banner, denn es ist eine schriftliche Zusage, die eine Aufsichtsbehörde prüfen kann.</p><p>Die Korrektur ist eine Zeile pro Skript. Öffnen Sie den Bericht für das genaue Tag:</p><p><a href="{3}">So beheben Sie es</a></p>
blockingAlertSiteKey.subject=Complyr auf {0} verwendet den falschen Site-Key
blockingAlertSiteKey.body=<p>Seit {1} Tag(en) enthält das Complyr-Snippet auf <strong>{0}</strong> einen Site-Key, der nicht zu dieser Website gehört.</p><p>Ihr Banner lädt damit eine fremde Konfiguration, und die Einwilligungen Ihrer Besucher werden nicht für {0} erfasst.</p><p>Öffnen Sie den Bericht, um das richtige Snippet zu kopieren:</p><p><a href="{2}">Snippet korrigieren</a></p>
