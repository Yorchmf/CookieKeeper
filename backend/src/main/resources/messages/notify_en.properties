verification.subject=Confirm your email address
verification.body=<p>Welcome to Complyr!</p><p>Please confirm your email address by clicking the link below:</p><p><a href="{0}">Confirm my email address</a></p><p>This link expires in 24 hours. If you did not create an account, you can ignore this email.</p>
reset.subject=Reset your password
reset.body=<p>We received a request to reset your Complyr password.</p><p><a href="{0}">Reset my password</a></p><p>This link expires in 1 hour. If you did not request a password reset, you can ignore this email.</p>
welcome.subject=Welcome to Complyr — your email is confirmed
welcome.body=<p>Your email is confirmed and your Complyr account is ready.</p><p>Add your first site, run a cookie scan, and embed your consent banner from the dashboard:</p><p><a href="{0}">Open my dashboard</a></p><p>Need a hand? Just reply to this email.</p>
subscriptionActivated.subject=Your Complyr {0} plan is active
subscriptionActivated.body=<p>Your Complyr {0} plan is now active — thank you for subscribing.</p><p>Every feature in your plan is unlocked. You can review invoices, update your payment method, or change plan anytime:</p><p><a href="{1}">Manage my subscription</a></p>
paymentIssue.subject=Action needed: your Complyr payment failed
paymentIssue.body=<p>We could not process the latest payment for your Complyr subscription.</p><p>Your banners keep running for now, but please update your payment method to avoid losing access:</p><p><a href="{0}">Update my payment method</a></p>
scanCompleted.subject=Cookie scan complete for {0}
scanCompleted.body=<p>We finished scanning <strong>{0}</strong>.</p><p>Cookies found: {1}<br>Marketing trackers: {2}</p><p>Open the full report to review each cookie, adjust your banner categories and refresh your cookie policy:</p><p><a href="{3}">View the scan report</a></p>
trialEnding.subject=Your Complyr trial ends soon
trialEnding.body=<p>Your free Complyr trial ends on <strong>{0}</strong>.</p><p>Choose a plan before then to keep your consent banners live, your scans running and your consent log collecting evidence:</p><p><a href="{1}">Choose a plan</a></p>
