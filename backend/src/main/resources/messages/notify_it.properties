verification.subject=Conferma il tuo indirizzo email
verification.body=<p>Benvenuto in Complyr!</p><p>Conferma il tuo indirizzo email facendo clic sul link qui sotto:</p><p><a href="{0}">Conferma il mio indirizzo email</a></p><p>Questo link scade tra 24 ore. Se non hai creato un account, puoi ignorare questa email.</p>
