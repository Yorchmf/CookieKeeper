verification.subject=Conferma il tuo indirizzo email
verification.body=<p>Benvenuto in Complyr!</p><p>Conferma il tuo indirizzo email facendo clic sul link qui sotto:</p><p><a href="{0}">Conferma il mio indirizzo email</a></p><p>Questo link scade tra 24 ore. Se non hai creato un account, puoi ignorare questa email.</p>
reset.subject=Reimposta la tua password
reset.body=<p>Abbiamo ricevuto una richiesta di reimpostazione della tua password Complyr.</p><p><a href="{0}">Reimposta la mia password</a></p><p>Questo link scade tra 1 ora. Se non hai richiesto la reimpostazione, puoi ignorare questa email.</p>
welcome.subject=Benvenuto in Complyr: la tua email è confermata
welcome.body=<p>La tua email è confermata e il tuo account Complyr è pronto.</p><p>Aggiungi il tuo primo sito, esegui una scansione dei cookie e integra il tuo banner di consenso dal pannello:</p><p><a href="{0}">Apri il mio pannello</a></p><p>Hai bisogno di aiuto? Rispondi a questa email.</p>
subscriptionActivated.subject=Il tuo piano Complyr {0} è attivo
subscriptionActivated.body=<p>Il tuo piano Complyr {0} è ora attivo: grazie per l''abbonamento.</p><p>Tutte le funzionalità del tuo piano sono sbloccate. Puoi consultare le fatture, aggiornare il metodo di pagamento o cambiare piano quando vuoi:</p><p><a href="{1}">Gestisci il mio abbonamento</a></p>
paymentIssue.subject=Azione necessaria: il tuo pagamento Complyr non è andato a buon fine
paymentIssue.body=<p>Non siamo riusciti a elaborare l''ultimo pagamento del tuo abbonamento Complyr.</p><p>I tuoi banner continuano a funzionare per ora, ma aggiorna il metodo di pagamento per non perdere l''accesso:</p><p><a href="{0}">Aggiorna il mio metodo di pagamento</a></p>
scanCompleted.subject=Scansione dei cookie completata per {0}
scanCompleted.body=<p>Abbiamo completato la scansione di <strong>{0}</strong>.</p><p>Cookie rilevati: {1}<br>Tracker di marketing: {2}</p><p>Apri il report completo per esaminare ogni cookie, aggiornare le categorie del tuo banner e la tua cookie policy:</p><p><a href="{3}">Vedi il report</a></p>
trialEnding.subject=La tua prova Complyr sta per scadere
trialEnding.body=<p>La tua prova gratuita di Complyr scade il <strong>{0}</strong>.</p><p>Scegli un piano prima di quella data per mantenere attivi i tuoi banner di consenso, continuare le scansioni e far sì che il tuo registro dei consensi continui a raccogliere prove:</p><p><a href="{1}">Scegli un piano</a></p>
