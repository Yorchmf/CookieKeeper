verification.subject=Confirma tu dirección de correo electrónico
verification.body=<p>¡Bienvenido a Complyr!</p><p>Confirma tu dirección de correo electrónico haciendo clic en el siguiente enlace:</p><p><a href="{0}">Confirmar mi correo electrónico</a></p><p>Este enlace caduca en 24 horas. Si no has creado una cuenta, puedes ignorar este correo.</p>
reset.subject=Restablece tu contraseña
reset.body=<p>Hemos recibido una solicitud para restablecer tu contraseña de Complyr.</p><p><a href="{0}">Restablecer mi contraseña</a></p><p>Este enlace caduca en 1 hora. Si no has solicitado el restablecimiento, puedes ignorar este correo.</p>
welcome.subject=Bienvenido a Complyr: tu correo está confirmado
welcome.body=<p>Tu correo electrónico está confirmado y tu cuenta de Complyr está lista.</p><p>Añade tu primer sitio, ejecuta un análisis de cookies e integra tu banner de consentimiento desde el panel:</p><p><a href="{0}">Abrir mi panel</a></p><p>¿Necesitas ayuda? Responde a este correo.</p>
subscriptionActivated.subject=Tu plan Complyr {0} está activo
subscriptionActivated.body=<p>Tu plan Complyr {0} ya está activo: gracias por suscribirte.</p><p>Todas las funciones de tu plan están desbloqueadas. Puedes consultar tus facturas, actualizar tu método de pago o cambiar de plan cuando quieras:</p><p><a href="{1}">Gestionar mi suscripción</a></p>
paymentIssue.subject=Acción necesaria: tu pago de Complyr ha fallado
paymentIssue.body=<p>No hemos podido procesar el último pago de tu suscripción a Complyr.</p><p>Tus banners siguen funcionando por ahora, pero actualiza tu método de pago para no perder el acceso:</p><p><a href="{0}">Actualizar mi método de pago</a></p>
scanCompleted.subject=Análisis de cookies completado para {0}
scanCompleted.body=<p>Hemos terminado el análisis de <strong>{0}</strong>.</p><p>Cookies detectadas: {1}<br>Rastreadores de marketing: {2}</p><p>Abre el informe completo para revisar cada cookie, ajustar las categorías de tu banner y actualizar tu política de cookies:</p><p><a href="{3}">Ver el informe del análisis</a></p>
trialEnding.subject=Tu prueba de Complyr termina pronto
trialEnding.body=<p>Tu prueba gratuita de Complyr termina el <strong>{0}</strong>.</p><p>Elige un plan antes de esa fecha para que tus banners de consentimiento sigan activos, tus análisis sigan ejecutándose y tu registro de consentimiento siga recopilando pruebas:</p><p><a href="{1}">Elegir un plan</a></p>
emailChange.subject=Confirma tu nueva dirección de correo electrónico
emailChange.body=<p>Hemos recibido una solicitud para cambiar la dirección de correo de tu cuenta de Complyr por esta.</p><p>Confirma que es tu dirección haciendo clic en el siguiente enlace:</p><p><a href="{0}">Confirmar mi nueva dirección de correo</a></p><p>Este enlace caduca en 24 horas. Hasta que lo confirmes, tu cuenta mantiene su correo actual. Si no has solicitado este cambio, puedes ignorar este correo.</p>
emailChangedNotice.subject=Se ha cambiado la dirección de correo de tu cuenta de Complyr
emailChangedNotice.body=<p>La dirección de correo de tu cuenta de Complyr acaba de cambiarse por una nueva.</p><p>Si has sido tú, no necesitas hacer nada.</p><p>Si no has realizado este cambio, protege tu cuenta ahora restableciendo tu contraseña desde el panel:</p><p><a href="{0}">Ir a mi panel</a></p>
blockingAlertUnblocked.subject=Complyr está instalado en {0}, pero no bloquea nada
blockingAlertUnblocked.body=<p>Complyr lleva {1} día(s) activo en <strong>{0}</strong> y nuestros análisis siguen viendo estos servicios cargarse <em>antes</em> de que tus visitantes den su consentimiento:</p><p><strong>{2}</strong></p><p>Tu banner promete algo que el sitio no cumple, y eso es peor que no tener banner: es una declaración escrita que una autoridad puede comprobar.</p><p>La solución es una línea por script. Abre el informe para ver la etiqueta exacta:</p><p><a href="{3}">Ver cómo solucionarlo</a></p>
blockingAlertSiteKey.subject=Complyr en {0} usa una clave de sitio incorrecta
blockingAlertSiteKey.body=<p>Desde hace {1} día(s), el snippet de Complyr en <strong>{0}</strong> lleva una clave de sitio que no pertenece a este sitio.</p><p>Tu banner carga la configuración de otro sitio y los consentimientos de tus visitantes no se registran para {0}.</p><p>Abre el informe para copiar el snippet correcto:</p><p><a href="{2}">Corregir el snippet</a></p>
