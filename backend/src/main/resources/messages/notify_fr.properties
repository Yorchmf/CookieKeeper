verification.subject=Confirmez votre adresse e-mail
verification.body=<p>Bienvenue chez Complyr !</p><p>Veuillez confirmer votre adresse e-mail en cliquant sur le lien ci-dessous :</p><p><a href="{0}">Confirmer mon adresse e-mail</a></p><p>Ce lien expire dans 24 heures. Si vous n''avez pas créé de compte, vous pouvez ignorer cet e-mail.</p>
reset.subject=Réinitialisez votre mot de passe
reset.body=<p>Nous avons reçu une demande de réinitialisation de votre mot de passe Complyr.</p><p><a href="{0}">Réinitialiser mon mot de passe</a></p><p>Ce lien expire dans 1 heure. Si vous n''avez pas demandé cette réinitialisation, vous pouvez ignorer cet e-mail.</p>
welcome.subject=Bienvenue chez Complyr — votre e-mail est confirmé
welcome.body=<p>Votre adresse e-mail est confirmée et votre compte Complyr est prêt.</p><p>Ajoutez votre premier site, lancez une analyse des cookies et intégrez votre bannière de consentement depuis le tableau de bord :</p><p><a href="{0}">Ouvrir mon tableau de bord</a></p><p>Besoin d''aide ? Répondez simplement à cet e-mail.</p>
subscriptionActivated.subject=Votre offre Complyr {0} est active
subscriptionActivated.body=<p>Votre offre Complyr {0} est maintenant active — merci pour votre abonnement.</p><p>Toutes les fonctionnalités de votre offre sont débloquées. Vous pouvez consulter vos factures, mettre à jour votre moyen de paiement ou changer d''offre à tout moment :</p><p><a href="{1}">Gérer mon abonnement</a></p>
paymentIssue.subject=Action requise : votre paiement Complyr a échoué
paymentIssue.body=<p>Nous n''avons pas pu traiter le dernier paiement de votre abonnement Complyr.</p><p>Vos bannières continuent de fonctionner pour l''instant, mais veuillez mettre à jour votre moyen de paiement pour ne pas perdre l''accès :</p><p><a href="{0}">Mettre à jour mon moyen de paiement</a></p>
scanCompleted.subject=Analyse des cookies terminée pour {0}
scanCompleted.body=<p>Nous avons terminé l''analyse de <strong>{0}</strong>.</p><p>Cookies détectés : {1}<br>Traceurs marketing : {2}</p><p>Ouvrez le rapport complet pour examiner chaque cookie, ajuster les catégories de votre bannière et mettre à jour votre politique de cookies :</p><p><a href="{3}">Voir le rapport d''analyse</a></p>
trialEnding.subject=Votre essai Complyr se termine bientôt
trialEnding.body=<p>Votre essai gratuit Complyr se termine le <strong>{0}</strong>.</p><p>Choisissez une offre avant cette date pour que vos bannières de consentement restent actives, que vos analyses continuent et que votre journal de consentement continue de collecter des preuves :</p><p><a href="{1}">Choisir une offre</a></p>
emailChange.subject=Confirmez votre nouvelle adresse e-mail
emailChange.body=<p>Nous avons reçu une demande de modification de l''adresse e-mail de votre compte Complyr vers celle-ci.</p><p>Veuillez confirmer qu''il s''agit bien de votre adresse en cliquant sur le lien ci-dessous :</p><p><a href="{0}">Confirmer ma nouvelle adresse e-mail</a></p><p>Ce lien expire dans 24 heures. Tant que vous n''avez pas confirmé, votre compte conserve son adresse e-mail actuelle. Si vous n''êtes pas à l''origine de cette demande, vous pouvez ignorer cet e-mail.</p>
emailChangedNotice.subject=L'adresse e-mail de votre compte Complyr a été modifiée
emailChangedNotice.body=<p>L''adresse e-mail de votre compte Complyr vient d''être remplacée par une nouvelle adresse.</p><p>Si c''est bien vous, aucune action n''est nécessaire.</p><p>Si vous n''êtes pas à l''origine de ce changement, sécurisez votre compte immédiatement en réinitialisant votre mot de passe depuis le tableau de bord :</p><p><a href="{0}">Accéder à mon tableau de bord</a></p>
