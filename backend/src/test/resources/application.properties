# Test-only overrides (loaded alongside src/main/resources/application.yml —
# .properties takes precedence over .yml without shadowing it).
complyr.auth.jwt-secret=test-only-jwt-secret-0123456789-abcdefghijklmnop
# Secret for the stateless consent-origin token (>= 32 bytes; validated by the ConsentOriginToken bean).
complyr.consent.origin-token-secret=test-only-consent-origin-token-secret-0123456789
# Integration tests fire many auth requests from the same MockMvc "IP".
complyr.rate-limit.auth-per-minute=10000
# Disable the parallel-refresh grace window so reuse detection is testable on the wire.
complyr.auth.refresh-reuse-grace=0s
