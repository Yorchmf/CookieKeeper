# Test-only overrides (loaded alongside src/main/resources/application.yml —
# .properties takes precedence over .yml without shadowing it).
cookiekeeper.auth.jwt-secret=test-only-jwt-secret-0123456789-abcdefghijklmnop
# Secret for the stateless consent-origin token (>= 32 bytes; validated by the ConsentOriginToken bean).
cookiekeeper.consent.origin-token-secret=test-only-consent-origin-token-secret-0123456789
# Integration tests fire many auth requests from the same MockMvc "IP".
cookiekeeper.rate-limit.auth-per-minute=10000
# Disable the parallel-refresh grace window so reuse detection is testable on the wire.
cookiekeeper.auth.refresh-reuse-grace=0s
# Stripe placeholders so the full app context boots in @SpringBootTest; no test calls Stripe.
cookiekeeper.billing.stripe-secret-key=sk_test_dummy_for_tests
cookiekeeper.billing.webhook-secret=whsec_test_dummy
cookiekeeper.billing.price-ids.starter=price_test_starter
cookiekeeper.billing.price-ids.pro=price_test_pro
cookiekeeper.billing.price-ids.business=price_test_business
cookiekeeper.billing.automatic-tax=false
