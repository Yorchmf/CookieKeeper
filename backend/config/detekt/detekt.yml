# Complyr backend detekt configuration.
# Builds upon the detekt default ruleset (buildUponDefaultConfig = true in build.gradle.kts);
# only deviations from the defaults are listed here.

complexity:
  LongParameterList:
    # JPA entities and boundary DTOs are immutable data classes mirroring table/JSON shape.
    ignoreDataClasses: true
    # Constructor injection only (CLAUDE.md): DI constructors legitimately reach 8 collaborators
    # (e.g. AuthService, which orchestrates users, tokens, hashing, events, and the lockout tracker).
    constructorThreshold: 9
    # Test request-builder helpers expose every field as an optional named arg so each case sets
    # only what it exercises; that's a readability win, not a design smell (mirrors LongMethod below).
    excludes: ['**/src/test/**']
  LongMethod:
    # Full-wire integration tests read best as one linear scenario.
    excludes: ['**/src/test/**']
  TooManyFunctions:
    # Count only the public API surface; private helpers keep functions small.
    ignorePrivate: true
    # EntitlementService is the single source of truth for what a plan allows: each feature adds one
    # small `require*`/flag reader guard, so its public surface grows one method at a time by design.
    thresholdInClasses: 12
    # A Spring Data repository is a catalogue of queries over ONE aggregate, not a class with many
    # responsibilities: each method is a single query, and splitting one to satisfy a counter would
    # scatter access to the same table without buying cohesion (SiteRepository is the case in point).
    thresholdInInterfaces: 18

style:
  # Align with ktlint's official-style line length (ktlintFormat reflows to 140).
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    ignoreAnnotated:
      - "Configuration"
  ReturnCount:
    # Early elvis guards (`x ?: return null`) are the idiomatic Kotlin style (coding-style.md);
    # don't count them toward the return limit so guarded lookups stay flat instead of nested.
    excludeGuardClauses: true

performance:
  SpreadOperator:
    # Idiomatic Spring Boot entrypoint: runApplication<App>(*args).
    active: false
