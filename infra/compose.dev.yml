# Dev environment on the VPS.
# Run as compose project `cookiekeeper-dev` from /opt/cookiekeeper/dev:
#   docker compose -f compose.dev.yml --project-name cookiekeeper-dev up -d
# Container names get the `cookiekeeper-dev-` prefix from the project name —
# Caddy reaches them via the shared external `caddy-net` network.
#
# Images are pulled from GHCR (built by CI). IMAGE_TAG and GHCR_OWNER come
# from ./.env (deploy.sh maintains IMAGE_TAG via .env.deploy).
# Postgres has NO published ports; api/dashboard only `expose` to caddy-net.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: cookiekeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d complyr"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER}/cookiekeeper-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ./.env
    environment:
      SPRING_PROFILES_ACTIVE: api,dev
      # `:?` fails the deploy loudly if .env is missing these — otherwise the
      # backend would silently fall back to built-in local defaults.
      DB_USER: ${DB_USER:?DB_USER missing from .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing from .env}
    expose:
      - "8080"
    networks:
      # Explicit priority, not sort order: the highest-priority network provides
      # the default route, so outbound fetches leave with a `default` source
      # address. The egress firewall (ADR-18) exempts far less on the shared
      # caddy-net, and which interface egress uses must not be an accident.
      default:
        priority: 100
      caddy-net:
        priority: 10
    depends_on:
      postgres:
        condition: service_healthy

  scanner:
    image: ghcr.io/${GHCR_OWNER}/cookiekeeper-scanner:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ./.env
    environment:
      SPRING_PROFILES_ACTIVE: scanner,dev
      DB_USER: ${DB_USER:?DB_USER missing from .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing from .env}
    # No ports at all — scanner is outbound-only (SSRF posture, §4.4)
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: ghcr.io/${GHCR_OWNER}/cookiekeeper-dashboard:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ./.env
    # No NEXT_PUBLIC_API_URL: the client uses same-origin /api/v1/* (Caddy
    # proxies it to the api container) — runtime env can't affect NEXT_PUBLIC_*
    # anyway, they are baked at build time.
    expose:
      - "3000"
    networks:
      default:
        priority: 100
      caddy-net:
        priority: 10
    depends_on:
      - api

volumes:
  pgdata:

networks:
  caddy-net:
    external: true
  # Pinned so the egress firewall (ADR-18, infra/scripts/egress-firewall.sh) keeps
  # matching after a `compose up` recreates the network — the rules are written per
  # source subnet, and a renumbered subnet would silently stop being filtered.
  # 10.31.x is outside docker's default allocation pool, so it cannot collide with
  # an auto-assigned network. prd uses 10.31.20.0/24.
  default:
    ipam:
      config:
        - subnet: 10.31.10.0/24
