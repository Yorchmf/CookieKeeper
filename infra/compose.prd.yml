# Production environment, on its own machine (cookiekeeper-prd-app).
# Run as compose project `cookiekeeper-prd` from /opt/cookiekeeper/prd:
#   docker compose -f compose.prd.yml --project-name cookiekeeper-prd up -d
#
# Same shape as compose.dev.yml. The differences are the .env contents, the project
# name, the pinned subnet — and no Mailpit: prd delivers through Brevo
# (MAIL_PROVIDER=brevo), dev captures mail locally so it can never reach a real
# inbox. `MAIL_PROVIDER=smtp` here would silently send mail nowhere.
#
# IMAGE_TAG in prd is a release tag (v*), promoted from the dev-tested digest.
#
# NO POSTGRES HERE (ADR-24). The database is bare Postgres 16 on a dedicated host,
# cookiekeeper-prd-db, reached at 10.20.20.20:5432 over the prd private network.
# There is no route from this machine to dev's database, or from dev's machine to
# this one — the two private networks are separate layer-2 domains.
#
# RESOURCE LIMITS — sized for this stack ALONE on a Hetzner CX22 (2 vCPU / 4 GB),
# leaving ~1 GB for the host, dockerd and Caddy. The api and scanner ceilings are
# deliberately IDENTICAL to compose.dev.yml so dev hits a too-tight limit first.
# Resize the box → edit both files together (they are rsynced by deploy.sh, so a
# server-side edit is overwritten on the next deploy). Re-run the k6 smoke test in
# infra/load/ after changing any of them.
#   mem_limit     hard ceiling; the container is OOM-killed rather than the kernel
#                 picking a victim by size.
#   memswap_limit == mem_limit means "no swap", so a leak fails fast instead of
#                 thrashing the disk and taking the whole box down with it.
#   cpus          ceiling, cpu_shares relative weight under contention. Both are
#                 set on the scanner: a runaway crawl must not starve the API of
#                 the CPU it needs to answer /api/v1/consent.
#   pids_limit    fork-bomb backstop; Chromium spawns a process per tab.

services:
  api:
    image: ghcr.io/${GHCR_OWNER}/cookiekeeper-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ./.env
    environment:
      SPRING_PROFILES_ACTIVE: api,prd
      # `:?` fails the deploy loudly if .env is missing these — otherwise the backend
      # would silently fall back to built-in local defaults, and DB_URL's default is
      # localhost, which on this host is nothing at all.
      DB_URL: ${DB_URL:?DB_URL missing from .env}
      DB_USER: ${DB_USER:?DB_USER missing from .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing from .env}
      # JDK 21 reads the cgroup limit, but defaults MaxRAMPercentage to 25% — a
      # 320 MB heap inside a 1.25 GB container, with the rest spent on nothing. 70%
      # leaves room for metaspace, code cache, thread stacks and direct buffers,
      # which live OUTSIDE the heap and still count against mem_limit. Without this
      # the container is either wasteful or OOM-killed.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    volumes:
      # The database's self-signed certificate, pinned as the trust root for
      # sslmode=verify-ca. Read-only, and NOT rsynced by the deploy — like .env it is
      # placed by hand, so automation cannot swap the thing that establishes trust.
      - ./pgca.crt:/etc/ssl/pgca.crt:ro
    expose:
      - "8080"
    networks:
      # Explicit priority, not sort order: the highest-priority network provides the
      # default route, so outbound fetches leave with a `default` source address. The
      # egress firewall (ADR-18) exempts far less on caddy-net, and which interface
      # egress uses must not be an accident.
      default:
        priority: 100
      caddy-net:
        priority: 10
    # No depends_on for the database: it is a separate always-on host, not a sibling
    # container, so there is no local condition to wait for. If it is unreachable
    # Flyway fails at boot and `restart: unless-stopped` retries — which is the
    # correct behaviour, and louder than starting up half-working.
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 2.0
    cpu_shares: 2048
    pids_limit: 512

  scanner:
    image: ghcr.io/${GHCR_OWNER}/cookiekeeper-scanner:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ./.env
    environment:
      SPRING_PROFILES_ACTIVE: scanner,prd
      DB_URL: ${DB_URL:?DB_URL missing from .env}
      DB_USER: ${DB_USER:?DB_USER missing from .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing from .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    volumes:
      - ./pgca.crt:/etc/ssl/pgca.crt:ro
    # No ports at all — scanner is outbound-only (SSRF posture, §4.4)
    # Chromium puts renderer shared memory in /dev/shm, which docker sizes at 64 MB
    # by default. A content-heavy page overruns that and the tab dies with a bare
    # "Target crashed" — a scan failure that looks like the customer's site's fault.
    shm_size: 512mb
    # Lowest weight here: when the box is saturated the scanner is the only workload
    # that may wait. An OOM kill is recoverable — ScanQueue leases jobs with a
    # visibility timeout, so a job the killed worker held is reclaimed when the lease
    # lapses rather than stuck in `running` forever.
    mem_limit: 1408m
    memswap_limit: 1408m
    cpus: 1.0
    cpu_shares: 512
    pids_limit: 1024

  dashboard:
    image: ghcr.io/${GHCR_OWNER}/cookiekeeper-dashboard:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ./.env
    # No NEXT_PUBLIC_API_URL: the client uses same-origin /api/v1/* (Caddy proxies it
    # to the api container) — runtime env can't affect NEXT_PUBLIC_* anyway, they are
    # baked at build time.
    expose:
      - "3000"
    networks:
      default:
        priority: 100
      caddy-net:
        priority: 10
    depends_on:
      - api
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    cpu_shares: 1024
    pids_limit: 256

networks:
  caddy-net:
    external: true
  # Pinned so the egress firewall (ADR-18, infra/scripts/egress-firewall.sh) keeps
  # matching after a `compose up` recreates the network — the rules are written per
  # source subnet, and a renumbered subnet would silently stop being filtered.
  # 10.31.x is outside docker's default allocation pool, so it cannot collide with an
  # auto-assigned network, and it does not overlap the 10.20.x Hetzner private
  # networks that carry database traffic. dev uses 10.31.10.0/24 on its own machine.
  default:
    ipam:
      config:
        - subnet: 10.31.20.0/24
