# Production deploy on git tag v* with a manual approval gate.
#
# Images are PROMOTED, not rebuilt: the sha-tagged images already built and
# smoke-tested on dev are retagged (by digest, via `docker buildx imagetools
# create`) with the release tag. What ran on dev is exactly what runs on prd.
name: Deploy prd

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-prd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # `environment: production` must be configured in the repo settings with a
  # required-reviewers protection rule — that is the manual approval gate.
  promote-images:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      # Needed to resolve the tag to its COMMIT sha: for annotated tags,
      # github.sha is the tag OBJECT sha, which deploy-dev never pushed as an
      # image tag. `git rev-parse HEAD` after checkout is always the commit.
      - uses: actions/checkout@v4
      - name: Lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Context values go through env vars, never templated into the script —
      # a crafted tag name must not become shell code.
      - name: Retag sha images with the release tag
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA="$(git rev-parse HEAD)"
          for image in complyr-api complyr-scanner complyr-dashboard; do
            echo "Promoting ghcr.io/${OWNER}/${image}:${SHA} -> :${TAG}"
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${image}:${TAG}" \
              "ghcr.io/${OWNER}/${image}:${SHA}"
          done

  # Widget assets for cdn.complyr.eu — built from the tagged commit.
  widget-cdn:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
        working-directory: widget
      - run: pnpm build && pnpm size
        working-directory: widget
      - name: Upload widget assets to cdn (prd)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: widget/dist/*
          target: /srv/cdn/prd/
          strip_components: 2

  deploy:
    needs: [promote-images, widget-cdn]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose file and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/compose.prd.yml,infra/scripts/deploy.sh
          target: /opt/complyr/prd/
          strip_components: 1
      # Tag name reaches the VPS as an env var, never templated into the
      # script (a crafted tag like `v1;cmd` must not execute on the server).
      - name: Deploy prd stack (Flyway migrates on boot)
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_TAG
          script: |
            chmod +x /opt/complyr/prd/scripts/deploy.sh
            /opt/complyr/prd/scripts/deploy.sh prd "$DEPLOY_TAG"

  # Production smoke MUST pass — a red run here is the deploy alarm.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: API health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 20 https://api.complyr.eu/actuator/health
      - name: Dashboard health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 20 https://app.complyr.eu/api/health
      - name: Widget on CDN
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 20 -o /dev/null https://cdn.complyr.eu/v1.js
