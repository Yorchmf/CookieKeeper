# Stage 2 — every commit that lands on main.
#
# Validate, test and build. Explicitly NO deploy: main is always releasable, but releasing is a
# decision someone makes by hand (release-dev.yml), not a consequence of merging.
#
# Images are pushed to GHCR tagged `sha-<short>` so that any main commit can be deployed or
# bisected later without a rebuild. The release workflow tags its own images; these are throwaway.
name: main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      run_tests: true
      run_build: true

  build-images:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: cookiekeeper-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: cookiekeeper-scanner
            context: ./backend
            dockerfile: ./backend/Dockerfile.scanner
          - image: cookiekeeper-dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in a repository path, and GitHub owners may contain capitals.
      - name: Lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
