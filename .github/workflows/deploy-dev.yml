# Continuous deploy to the DEV environment on every push to main:
#   build 3 images → GHCR (sha + dev-latest) → widget assets to the CDN dir
#   → SSH deploy.sh dev <sha> → smoke test (non-blocking while the server is
#   still being provisioned).
name: Deploy dev

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel a deploy midway

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    strategy:
      matrix:
        include:
          - image: complyr-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: complyr-scanner
            context: ./backend
            dockerfile: ./backend/Dockerfile.scanner
          - image: complyr-dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # GHCR requires a lowercase namespace
      - name: Lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:dev-latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Build the widget and publish dist/ to the dev CDN directory served by Caddy.
  widget-cdn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
        working-directory: widget
      - run: pnpm build && pnpm size
        working-directory: widget
      - name: Upload widget assets to cdn.dev
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: widget/dist/*
          target: /srv/cdn/dev/
          strip_components: 2 # widget/dist/v1.js → /srv/cdn/dev/v1.js

  deploy:
    needs: [build-images, widget-cdn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep server-side compose file + scripts in sync with the repo
      # (no config drift — the repo is the source of truth).
      - name: Sync compose file and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/compose.dev.yml,infra/scripts/deploy.sh
          target: /opt/complyr/dev/
          strip_components: 1 # infra/compose.dev.yml → /opt/complyr/dev/compose.dev.yml
      # Context values reach the VPS as env vars, never templated into the
      # script (consistent with deploy-prd; github.sha is safe hex, but the
      # pattern should be uniform).
      - name: Deploy dev stack
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_TAG
          script: |
            chmod +x /opt/complyr/dev/scripts/deploy.sh
            /opt/complyr/dev/scripts/deploy.sh dev "$DEPLOY_TAG"

  # Smoke test through the public dev domains. Non-blocking (continue-on-error)
  # while the VPS/domains are still being provisioned — flip to blocking once
  # dev is live.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: API health
        run: curl --fail --silent --show-error --max-time 20 https://api.dev.complyr.eu/actuator/health
      - name: Dashboard health
        run: curl --fail --silent --show-error --max-time 20 https://dev.complyr.eu/api/health
      - name: Widget on CDN
        run: curl --fail --silent --show-error --max-time 20 -o /dev/null https://cdn.dev.complyr.eu/v1.js
      - name: Warn on failure
        if: failure()
        run: echo "::warning::Dev smoke test failed — server may not be provisioned yet"
