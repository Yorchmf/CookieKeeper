# Stage 4 — promote a tag to production. Manual (workflow_dispatch) on a tag ref.
#
#   1. validate + run tests (again, on the exact tagged tree)
#   2. verify the images for that tag exist and were built by release-dev
#   3. terraform apply (prd) + deploy to prd
#
# NOTHING IS REBUILT. Production runs the byte-identical images that were verified in dev; this
# workflow only resolves them by digest and points prd at them. A rebuild would mean prd ships an
# artifact nobody ever tested, even from the same source.
#
# Gated by the `production` GitHub environment — configure a required reviewer on it so the deploy
# job waits for a human before it touches prd.
name: release-prd

on:
  workflow_dispatch:

concurrency:
  group: release-prd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require a tag ref
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "::error::release-prd must be dispatched on a tag (got ${{ github.ref_type }} ${{ github.ref }}). Use the 'Run workflow' ref picker and choose a vX.Y.Z tag."
            exit 1
          fi
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vX.Y.Z)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Promoting \`$tag\` to production" >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: guard
    uses: ./.github/workflows/quality.yml
    with:
      run_tests: true
      run_build: true

  verify-images:
    needs: [guard, quality]
    runs-on: ubuntu-latest
    # These digests are what the deploy job pins. Resolving the tag ONCE here and carrying the
    # answer forward is the point: if this job only checked that the tag exists and the deploy job
    # pulled it by name, a tag repointed in GHCR in between would put an unverified image into
    # production, and both jobs would still be green.
    #
    # This closes the resolve→run window, NOT the dev→prd one: the tag is read here, at promotion
    # time, so a repoint that happened after the dev release is pinned faithfully and reported as
    # success. Closing that needs the digest recorded by release-dev and compared here.
    outputs:
      api: ${{ steps.digests.outputs.api }}
      scanner: ${{ steps.digests.outputs.scanner }}
      dashboard: ${{ steps.digests.outputs.dashboard }}
    steps:
      - name: Lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # If this fails, the tag was never released to dev. Fix that first — do not "just build it
      # here", because then prd would run an artifact that has never been exercised anywhere.
      - name: Resolve the digests release-dev published
        id: digests
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          for component in api scanner dashboard; do
            ref="ghcr.io/${OWNER}/cookiekeeper-${component}:${TAG}"
            if ! digest="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$ref" 2>/dev/null)"; then
              echo "::error::${ref} does not exist. Run release-dev for ${TAG} before promoting it."
              exit 1
            fi
            # deploy.sh rejects anything that is not sha256:<64 hex>, but failing here names the
            # image and stops before production is touched at all.
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${ref} resolved to '${digest}', which is not a sha256 digest."
              exit 1
            fi
            echo "${component}=${digest}" >> "$GITHUB_OUTPUT"
            echo "- \`cookiekeeper-${component}\` → \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  infra:
    needs: [guard, verify-images]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # The prd APP host. Outputs are maps keyed by environment since each environment gained its own
      # app and database machine (ADR-24); the database host has no public DNS by design.
      - name: Read the origin IP from platform state
        id: platform
        working-directory: infra/terraform/platform
        run: |
          set -euo pipefail
          terraform init -input=false
          ipv4="$(terraform output -json app_ipv4 | jq -r '.prd // empty')"
          [[ -n "$ipv4" ]] || { echo "::error::platform state has no app_ipv4 for prd"; exit 1; }
          echo "ipv4=$ipv4" >> "$GITHUB_OUTPUT"

      # The plan is printed before it runs so the approval on the `production` environment is made
      # against a visible diff rather than a promise.
      - name: Apply prd infrastructure
        working-directory: infra/terraform/environments
        env:
          TF_VAR_origin_ipv4: ${{ steps.platform.outputs.ipv4 }}
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform workspace select prd || terraform workspace new prd
          terraform plan -input=false -var-file=prd.tfvars -out=prd.tfplan
          terraform apply -input=false -auto-approve prd.tfplan

  widget-cdn:
    needs: [guard, verify-images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build widget + size gate
        working-directory: widget
        run: pnpm build && pnpm size

      # The widget is static files, not a container, so it is the one artifact that is rebuilt for
      # prd. It is built from the same tag and the size gate re-runs, so the output is reproducible.
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRD_SSH_HOST }}
          username: ${{ secrets.PRD_SSH_USER }}
          key: ${{ secrets.PRD_SSH_KEY }}
          source: widget/dist/*
          target: /srv/cdn/prd/
          strip_components: 2

  deploy:
    # verify-images is listed even though infra already depends on it: `needs` outputs are not
    # inherited transitively, and without it the three digests below would silently resolve to the
    # empty string — an unpinned deploy that looks exactly like a pinned one.
    needs: [guard, verify-images, infra, widget-cdn]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # deploy.sh refuses to run on the wrong machine, but scp happens first — so a swapped
      # PRD_SSH_HOST/DEV_SSH_HOST secret would write a compose file into /opt/cookiekeeper/prd/
      # on the dev box before anything objected. Check first.
      - name: Confirm this is the prd app host
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRD_SSH_HOST }}
          username: ${{ secrets.PRD_SSH_USER }}
          key: ${{ secrets.PRD_SSH_KEY }}
          script: |
            if [ "$(hostname -s)" != "cookiekeeper-prd-app" ]; then
              echo "PRD_SSH_HOST resolves to $(hostname -s), not cookiekeeper-prd-app" >&2
              exit 1
            fi

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRD_SSH_HOST }}
          username: ${{ secrets.PRD_SSH_USER }}
          key: ${{ secrets.PRD_SSH_KEY }}
          source: infra/compose.yml,infra/scripts/deploy.sh
          target: /opt/cookiekeeper/prd/
          strip_components: 1

      # The tag says WHICH release; the digests say which bytes. deploy.sh turns each into a
      # `repo:tag@sha256:…` reference, so docker pulls the manifest verify-images resolved rather
      # than whatever the tag points at by the time this step runs.
      - uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_TAG: ${{ needs.guard.outputs.tag }}
          API_DIGEST: ${{ needs.verify-images.outputs.api }}
          SCANNER_DIGEST: ${{ needs.verify-images.outputs.scanner }}
          DASHBOARD_DIGEST: ${{ needs.verify-images.outputs.dashboard }}
        with:
          host: ${{ secrets.PRD_SSH_HOST }}
          username: ${{ secrets.PRD_SSH_USER }}
          key: ${{ secrets.PRD_SSH_KEY }}
          envs: DEPLOY_TAG,API_DIGEST,SCANNER_DIGEST,DASHBOARD_DIGEST
          script: |
            chmod +x /opt/cookiekeeper/prd/scripts/deploy.sh
            /opt/cookiekeeper/prd/scripts/deploy.sh prd "$DEPLOY_TAG"

  smoke:
    needs: [guard, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: API health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --max-time 20 https://api.cookiekeeper.eu/actuator/health
      - name: Dashboard health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --max-time 20 https://app.cookiekeeper.eu/api/health
      - name: Widget on the CDN
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --max-time 20 -o /dev/null https://cdn.cookiekeeper.eu/v1.js

      # A red smoke check means production is serving the new release badly. Roll back by
      # dispatching this workflow on the previous tag — the images are still in GHCR.
      - name: Summary
        run: echo "### \`${{ needs.guard.outputs.tag }}\` is live in production" >> "$GITHUB_STEP_SUMMARY"
